name: Standard CI

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: The target environment
        type: environment
        default: staging
        required: true
jobs:
  build:
    uses: ./.github/workflows/independent_build.yaml

  build_result:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: "echo 'the result is ${{ needs.build.outputs.build_result }}'"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: "echo 'testing ...'"
      - run: "echo 'using API key: ${{ secrets.API_KEY }}'"

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: ${{ inputs.environment }}
    steps:
      - run: "echo 'deploying to ${{ inputs.environment }} ...'"
