name: Standard CI

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: The target environment
        type: environment
        default: staging
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: "echo 'building ...'"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: "echo 'testing ...'"

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: ${{ inputs.environment }}
    steps:
      - run: "echo 'deploying to ${{ inputs.environment }} ...'"
