name: Standard CI

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: The target environment
        type: choice
        options:
          - dev
          - staging
          - production
        default: staging
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: "echo 'building ...'"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: "echo 'testing ...'"

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: "echo 'deploying ...'"
